name: build and test

on: pull_request

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache YAXT
        id: cache_yaxt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yaxt/
          key: ${{ runner.os }}-yaxt-cache-v0.12.1
          restore-keys: |
            ${{ runner.os }}-yaxt-

      - name: Cache YAC
        id: cache_yac
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/yac/
          key: ${{ runner.os }}-yac-cache-v3.19.0
          restore-keys: |
            ${{ runner.os }}-yac-

      - name: Setup
        if: steps.cache_yaxt.outputs.cache-hit != 'true' || steps.cache_yac.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          cmake libnetcdff-dev liblapack-dev python3-dev \
          python3-numpy python3-mpi4py python3-pip curl \
          libfyaml-dev libopenmpi-dev openmpi-bin

      - name: Build YAXT
        if: steps.cache_yaxt.outputs.cache-hit != 'true'
        run: |
          mkdir yaxt-0.12.1 && cd yaxt-0.12.1
          curl -s -L https://owncloud.gwdg.de/index.php/s/wWQnb09qZFF4xYY/download | tar xvz --strip-components=1
          ./configure --without-regard-for-quality --without-example-programs \
            --without-perf-programs --with-pic --prefix=${{ runner.temp }}/yaxt
          make -j 4
          make install

      - name: Build YAC
        if: steps.cache_yac.outputs.cache-hit != 'true'
        run: |
          mkdir yac-v3.19.0 && cd yac-v3.19.0
          curl -s -L https://owncloud.gwdg.de/index.php/s/i1f5mUeStUYWSG9/download | tar xvz --strip-components=1
          ./configure CFLAGS="-fPIC" CC=mpicc FC=mpif90 --disable-mpi-checks \
            --with-yaxt-root=${{ runner.temp }}/yaxt --prefix=${{ runner.temp }}/yac
          make -j 4
          make install

  build_basic_examples:
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        target: [all, eurec4a1d_null_microphysics, eurec4a1d_condensation, eurec4a1d_collision_condensation,
                eurec4a1d_coalbure_condensation_small, eurec4a1d_coalbure_condensation_large]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          cmake libopenmpi-dev openmpi-bin

      - name: Build Example
        run: |
          mkdir build
          cmake -S ./ -B ./build \
          -DCMAKE_C_COMPILER=mpicc \
          -DCMAKE_CXX_COMPILER=mpic++ \
          -DCMAKE_CXX_FLAGS="-Werror -Wall -pedantic -O3" \
          -DCMAKE_BUILD_TYPE=Release \
          -DKokkos_ENABLE_SERIAL=ON \
          -DCLEO_COUPLED_DYNAMICS=fromfile \
          -DCLEO_DOMAIN=cartesian
          -DCLEO_FYAMLLIB=/usr/lib/x86_64-linux-gnu \
          -DCLEO_YAXT_ROOT=${{ runner.temp }}/yaxt \
          -DCLEO_YAC_ROOT=${{ runner.temp }}/yac \
          -DCMAKE_MODULE_PATH=${PWD}/libs/coupldyn_yac/cmake

      - name: Compile Example
        run: cd build && make ${{ matrix.target }}
